<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">AI package roles around the bot</title><desc id="d">ProtocolAi and GrammarAi define identity and structure; CommandAi represents proposals; HeadlessAi is optional model transport; CiAi handles CI evidence; Profiles is adjacent identity/disclosure. SingularityBot and FSM_API own execution.</desc><rect width="1200" height="700" rx="24" fill="#111d31"/><text x="55" y="60" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Distinct contracts. One authoritative runtime.</text><g font-family="Arial" text-anchor="middle"><g fill="#fff"><rect x="55" y="110" width="330" height="125" rx="16" fill="#23466a" stroke="#60a5fa" stroke-width="2"/><text x="220" y="155" font-size="26" font-weight="700">ProtocolAi</text><text x="220" y="190" font-size="17">What does this identity mean?</text><rect x="435" y="110" width="330" height="125" rx="16" fill="#23466a" stroke="#60a5fa" stroke-width="2"/><text x="600" y="155" font-size="26" font-weight="700">GrammarAi</text><text x="600" y="190" font-size="17">How may it be structured?</text><rect x="815" y="110" width="330" height="125" rx="16" fill="#23466a" stroke="#60a5fa" stroke-width="2"/><text x="980" y="155" font-size="26" font-weight="700">CommandAi</text><text x="980" y="190" font-size="17">What is being proposed?</text><rect x="55" y="290" width="330" height="120" rx="16" fill="#44345e" stroke="#c4b5fd" stroke-width="2"/><text x="220" y="335" font-size="25" font-weight="700">HeadlessAi</text><text x="220" y="370" font-size="16">Optional model transport</text><rect x="435" y="290" width="330" height="120" rx="16" fill="#374151" stroke="#9ca3af" stroke-width="2"/><text x="600" y="335" font-size="25" font-weight="700">Profiles</text><text x="600" y="370" font-size="16">Creator identity / disclosure</text><rect x="815" y="290" width="330" height="120" rx="16" fill="#44345e" stroke="#c4b5fd" stroke-width="2"/><text x="980" y="335" font-size="25" font-weight="700">CiAi</text><text x="980" y="370" font-size="16">CI evidence / coordination</text><rect x="170" y="500" width="860" height="145" rx="22" fill="#115e59" stroke="#5eead4" stroke-width="3"/><text x="600" y="545" font-size="30" font-weight="700">SingularityBot + FSM_API</text><text x="600" y="585" font-size="18">Game ontology · BotDefinition · FSM lifecycle · goals/builders</text><text x="600" y="615" font-size="17">Observations → arbitration → legality → SC2 actions</text></g><g stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"><path d="M220 235V280M600 235V280M980 235V280"/></g><path d="M600 410V490" stroke="#5eead4" stroke-width="4"/><text x="600" y="460" fill="#ccfbf1" font-size="15">validated host integration only</text></g></svg>