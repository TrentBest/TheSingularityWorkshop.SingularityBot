<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Scriptable bot landscape</title><desc id="d">User authoring and language contracts feed the bot-owned definition and FSM runtime. Optional model assistance and CI evidence surround it.</desc><rect width="1200" height="420" rx="24" fill="#111d31"/><text x="55" y="58" fill="#fff" font-family="Arial" font-size="29" font-weight="700">From human intent to governed game behavior</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="115" width="230" height="105" rx="14" fill="#23466a" stroke="#60a5fa" stroke-width="2"/><text x="160" y="155" fill="#fff" font-size="20" font-weight="700">User / GUI</text><text x="160" y="185" fill="#dbeafe" font-size="15">Visual authoring</text><rect x="335" y="115" width="230" height="105" rx="14" fill="#23466a" stroke="#60a5fa" stroke-width="2"/><text x="450" y="155" fill="#fff" font-size="20" font-weight="700">Language</text><text x="450" y="185" fill="#dbeafe" font-size="15">Protocol + Grammar</text><rect x="625" y="115" width="230" height="105" rx="14" fill="#115e59" stroke="#5eead4" stroke-width="2"/><text x="740" y="155" fill="#fff" font-size="20" font-weight="700">BotDefinition</text><text x="740" y="185" fill="#ccfbf1" font-size="15">Domain validation</text><rect x="915" y="115" width="240" height="105" rx="14" fill="#115e59" stroke="#5eead4" stroke-width="2"/><text x="1035" y="155" fill="#fff" font-size="20" font-weight="700">FSM_API</text><text x="1035" y="185" fill="#ccfbf1" font-size="15">Runtime execution</text><g stroke="#94a3b8" stroke-width="3"><path d="M275 168H325M565 168H615M855 168H905"/></g><rect x="170" y="285" width="330" height="90" rx="14" fill="#44345e" stroke="#c4b5fd" stroke-width="2"/><text x="335" y="320" fill="#fff" font-size="19" font-weight="700">HeadlessAi + CommandAi</text><text x="335" y="348" fill="#ddd6fe" font-size="15">Optional untrusted proposals</text><rect x="700" y="285" width="330" height="90" rx="14" fill="#44345e" stroke="#c4b5fd" stroke-width="2"/><text x="865" y="320" fill="#fff" font-size="19" font-weight="700">CiAi + replay evidence</text><text x="865" y="348" fill="#ddd6fe" font-size="15">Engineering feedback loop</text><path d="M335 280V230M865 280V230" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6"/></g></svg>