<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Scriptable bot roadmap</title><desc id="d">Six phases: definition model, FSM binding, visual inspector, AI contracts, replay and CI evidence, ecosystem authoring.</desc><rect width="1200" height="390" rx="24" fill="#111d31"/><text x="55" y="60" fill="#fff" font-family="Arial" font-size="29" font-weight="700">Build the contract first; add intelligence around it</text><g font-family="Arial" text-anchor="middle"><g><rect x="45" y="115" width="165" height="180" rx="14" fill="#1d4560" stroke="#67e8f9" stroke-width="2"/><text x="127" y="155" fill="#cffafe" font-size="18">01</text><text x="127" y="200" fill="#fff" font-size="17">Bot Definition</text><text x="127" y="225" fill="#fff" font-size="17">Model</text><text x="127" y="265" fill="#a5f3fc" font-size="13">schema + tests</text></g><g><rect x="240" y="115" width="165" height="180" rx="14" fill="#1d4560" stroke="#67e8f9" stroke-width="2"/><text x="322" y="155" fill="#cffafe" font-size="18">02</text><text x="322" y="200" fill="#fff" font-size="17">FSM_API</text><text x="322" y="225" fill="#fff" font-size="17">binding</text><text x="322" y="265" fill="#a5f3fc" font-size="13">match proof</text></g><g><rect x="435" y="115" width="165" height="180" rx="14" fill="#254b54" stroke="#5eead4" stroke-width="2"/><text x="517" y="155" fill="#ccfbf1" font-size="18">03</text><text x="517" y="200" fill="#fff" font-size="17">Visual</text><text x="517" y="225" fill="#fff" font-size="17">inspector</text><text x="517" y="265" fill="#99f6e4" font-size="13">one truth</text></g><g><rect x="630" y="115" width="165" height="180" rx="14" fill="#44345d" stroke="#c4b5fd" stroke-width="2"/><text x="712" y="155" fill="#ede9fe" font-size="18">04</text><text x="712" y="200" fill="#fff" font-size="17">AI package</text><text x="712" y="225" fill="#fff" font-size="17">adoption</text><text x="712" y="265" fill="#ddd6fe" font-size="13">optional lanes</text></g><g><rect x="825" y="115" width="165" height="180" rx="14" fill="#44345d" stroke="#c4b5fd" stroke-width="2"/><text x="907" y="155" fill="#ede9fe" font-size="18">05</text><text x="907" y="200" fill="#fff" font-size="17">Replay + CI</text><text x="907" y="225" fill="#fff" font-size="17">evidence</text><text x="907" y="265" fill="#ddd6fe" font-size="13">repeatable results</text></g><g><rect x="1020" y="115" width="150" height="180" rx="14" fill="#254b54" stroke="#5eead4" stroke-width="2"/><text x="1095" y="155" fill="#ccfbf1" font-size="18">06</text><text x="1095" y="200" fill="#fff" font-size="17">Ecosystem</text><text x="1095" y="225" fill="#fff" font-size="17">authoring</text><text x="1095" y="265" fill="#99f6e4" font-size="13">share + compose</text></g><path d="M210 205H235M405 205H430M600 205H625M795 205H820M990 205H1015" stroke="#94a3b8" stroke-width="3"/></g><text x="600" y="350" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="16">Every phase keeps execution deterministic, inspectable, and fail-closed.</text></svg>