name: Build

on:
  push:
    branches: [master, development]
    paths:
      - "src/**"
      - "tests/**"
      - "schemas/**"
      - "strategies/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate strategy documents
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schemas/strategy.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          files = sorted(Path("strategies").glob("*.json"))
          if not files:
              raise SystemExit("No strategy JSON files found.")
          for path in files:
              document = json.loads(path.read_text(encoding="utf-8"))
              errors = sorted(validator.iter_errors(document), key=lambda error: list(map(str, error.absolute_path)))
              if errors:
                  for error in errors:
                      location = "/".join(map(str, error.absolute_path)) or "$"
                      print(f"{path}:{location}: {error.message}")
                  raise SystemExit(f"Strategy validation failed: {path}")
              print(f"Validated {path}")
          PY
      - name: Restore
        run: dotnet restore src/SingularityBot.Runner/SingularityBot.Runner.csproj
      - name: Build
        run: dotnet build src/SingularityBot.Runner/SingularityBot.Runner.csproj --configuration Release --no-restore
      - name: Test
        if: hashFiles('tests/SingularityBot.Tests/SingularityBot.Tests.csproj') != ''
        run: dotnet test tests/SingularityBot.Tests/SingularityBot.Tests.csproj --configuration Release
