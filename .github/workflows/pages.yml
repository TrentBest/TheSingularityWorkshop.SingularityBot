name: Publish documentation

on:
  # Publishing is deliberately manual; development commits must never deploy Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage documentation and reference artifacts
        run: |
          mkdir -p _pages
          cp -R docs/. _pages/
          mkdir -p _pages/strategies
          cp strategies/*.json _pages/strategies/
          mkdir -p _pages/military-plans
          cp military-plans/*.json _pages/military-plans/
          mkdir -p _pages/schemas
          cp schemas/*.json _pages/schemas/
          mkdir -p _pages/examples/bot-definitions
          cp examples/bot-definitions/*.json _pages/examples/bot-definitions/
          mkdir -p _pages/examples/map-documents/payloads
          cp examples/map-documents/*.json _pages/examples/map-documents/
          cp examples/map-documents/payloads/* _pages/examples/map-documents/payloads/
          mkdir -p _pages/examples/match-snapshots
          cp examples/match-snapshots/*.json _pages/examples/match-snapshots/

      - name: Build Markdown documentation site
        uses: actions/jekyll-build-pages@v1
        with:
          source: _pages
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: TrentBest/TheSingularityWorkshop.CiAi/.github/workflows/deploy-pages.yml@5083c452b555d7645dd0c8ab01d76008026da436
