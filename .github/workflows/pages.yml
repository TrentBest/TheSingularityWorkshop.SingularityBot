name: Publish documentation

on:
  # Publishing is deliberately manual; development commits must never deploy Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/strategies
          cp strategies/*.json _site/strategies/
          mkdir -p _site/military-plans
          cp military-plans/*.json _site/military-plans/
          touch _site/.nojekyll

      - name: Include strategy and military schemas
        run: |
          mkdir -p _site/schemas
          cp schemas/*.json _site/schemas/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
