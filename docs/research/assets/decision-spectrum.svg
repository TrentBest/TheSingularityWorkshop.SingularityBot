<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Three scriptable bot architecture choices</title><desc id="d">Path A direct bot implementation, Path B all-in Workshop packages, Path C recommended hybrid.</desc><rect width="1200" height="590" rx="24" fill="#111d31"/><text x="55" y="60" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Choose by responsibility—not package count</text><g font-family="Arial"><rect x="55" y="110" width="330" height="410" rx="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="220" y="155" text-anchor="middle" fill="#bfdbfe" font-size="24" font-weight="700">A · Direct</text><g fill="#fff" font-size="17"><text x="85" y="215">Bot owns schema + vocabulary</text><text x="85" y="255">Bot owns validation + proposals</text><text x="85" y="295">Bot owns model adapter (optional)</text><text x="85" y="335">FSM_API executes behavior</text></g><text x="85" y="420" fill="#93c5fd" font-size="15">+ minimal dependencies</text><text x="85" y="450" fill="#93c5fd" font-size="15">− duplicated generic contracts</text><text x="220" y="490" text-anchor="middle" fill="#fff" font-size="16">Best for one isolated bot</text><rect x="435" y="110" width="330" height="410" rx="18" fill="#3f2d56" stroke="#c4b5fd" stroke-width="2"/><text x="600" y="155" text-anchor="middle" fill="#ddd6fe" font-size="24" font-weight="700">B · All-in Workshop</text><g fill="#fff" font-size="17"><text x="465" y="215">ProtocolAi + GrammarAi</text><text x="465" y="255">CommandAi + HeadlessAi</text><text x="465" y="295">CiAi + host integration</text><text x="465" y="335">Bot compiler still required</text></g><text x="465" y="420" fill="#c4b5fd" font-size="15">+ maximum reuse potential</text><text x="465" y="450" fill="#c4b5fd" font-size="15">− integration / coupling cost</text><text x="600" y="490" text-anchor="middle" fill="#fff" font-size="16">Best for platform-first product</text><rect x="815" y="95" width="330" height="440" rx="18" fill="#134e4a" stroke="#5eead4" stroke-width="3"/><text x="980" y="145" text-anchor="middle" fill="#ccfbf1" font-size="24" font-weight="700">C · Hybrid</text><g fill="#fff" font-size="17"><text x="845" y="205">BotDefinition + game semantics</text><text x="845" y="245">FSM_API runtime + safety</text><text x="845" y="285">Grammar / identity as needed</text><text x="845" y="325">Proposals + optional model</text><text x="845" y="365">CiAi engineering evidence</text></g><text x="845" y="430" fill="#99f6e4" font-size="15">+ reusable deterministic center</text><text x="845" y="460" fill="#99f6e4" font-size="15">− requires disciplined boundaries</text><text x="980" y="505" text-anchor="middle" fill="#fff" font-size="16">Recommended path</text></g></svg>